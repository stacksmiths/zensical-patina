extends: material

font:
  text: IBM Plex Sans
  code: IBM Plex Mono

palette:
  - media: "(prefers-color-scheme)"
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: lucide/moon
      name: Switch to system preference
