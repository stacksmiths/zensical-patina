[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-patina"
version = "0.1.0"
description = "Zensical theme in cyan and amber like copper patina"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stack Smiths" }]
keywords = ["zensical", "mkdocs", "theme", "documentation", "patina"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["zensical>=0.0.37"]

[project.urls]
Homepage = "https://github.com/stacksmiths/zensical-patina"
Issues = "https://github.com/stacksmiths/zensical-patina/issues"

[project.entry-points."mkdocs.themes"]
patina = "patina"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["patina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
